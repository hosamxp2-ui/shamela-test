name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; else echo "project.zip not found"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www/vendor
          cp index.html www/index.html
          cp -r src www/src
          cp node_modules/sql.js/dist/sql-wasm.js www/vendor/
          cp node_modules/sql.js/dist/sql-wasm.wasm www/vendor/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: islamic-library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
