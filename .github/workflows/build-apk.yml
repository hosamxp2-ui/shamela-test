name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then unzip -o project.zip; else echo "project.zip not found"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install fonts (optional)
        run: npm install --no-save @fontsource/amiri @fontsource/noto-naskh-arabic @fontsource/scheherazade-new @fontsource/noto-kufi-arabic || echo "font packages unavailable, continuing without them"

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www/vendor
          cp index.html www/index.html
          cp -r src www/src
          cp node_modules/sql.js/dist/sql-wasm.js www/vendor/
          cp node_modules/sql.js/dist/sql-wasm.wasm www/vendor/
          cp node_modules/fflate/umd/index.js www/vendor/fflate.js || echo "fflate umd file missing; advanced decompression disabled"
          mkdir -p www/fonts
          for p in amiri noto-naskh-arabic scheherazade-new noto-kufi-arabic; do
            for w in 400 700; do
              f="node_modules/@fontsource/$p/files/$p-arabic-$w-normal.woff2"
              if [ -f "$f" ]; then cp "$f" www/fonts/; else echo "missing font file: $f"; fi
            done
          done

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure stable signing
        run: |
          test -f android/app/build.gradle || { echo "android/app/build.gradle not found"; ls android/app; exit 1; }
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("$GITHUB_WORKSPACE/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          tail -22 android/app/build.gradle

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          EXPECTED=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing certificate SHA-256:      $ACTUAL"
          echo "debug.keystore certificate SHA-256:   $EXPECTED"
          {
            echo "### Signing certificate (SHA-256)"
            echo "\`$ACTUAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "Stable signing key is in use." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The APK is NOT signed with debug.keystore. Updates will not install over earlier builds."
            echo "WARNING: APK is NOT signed with debug.keystore." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: islamic-library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
