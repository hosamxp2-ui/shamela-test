<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الشاملة</title>
<style>
  :root { --bg:#f6f7f4; --ink:#1d2a24; --card:#fff; --line:#cfd8d1; --ok:#1b7a4b; --bad:#b3261e; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14201a; --ink:#e6efe9; --card:#1c2b23; --line:#34493d; --ok:#5fd39a; --bad:#ff8a80; --warn:#f0c15a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; line-height:1.7; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  button { font:inherit; padding:12px 18px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); width:100%; margin:12px 0 6px; }
  button:disabled { opacity:.5; }
  button.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:8px 0; white-space:pre-wrap; word-break:break-word; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  textarea { width:100%; min-height:200px; direction:ltr; text-align:left; font:12px/1.5 ui-monospace,monospace; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px; }
</style>
</head>
<body>
<main>
  <h1>اختبار الشاملة (تطبيق أصلي)</h1>
  <p>يجرّب قراءة الخادم من التطبيق نفسه. لا يُنزَّل الملف الكبير: كتابان صغيران فقط.</p>
  <button id="run">ابدأ الاختبار</button>
  <div id="out"></div>
  <button id="copy" class="alt" disabled>نسخ النتيجة</button>
  <textarea id="log" readonly placeholder="ستظهر النتيجة هنا"></textarea>
</main>
<script>
const BASE = "https://files.murabbie.org/fsdownload/";
const PACK = BASE + "e4hWIOI7a/books.pack";
const INDEX_URL = BASE + "Ox50e9gb7/index.json";
const INDEX_SHA = "9b9e7a97000be5045d324022f0804ee0a28aee556efc0a22dce2f174a18fc3c2";
const TESTS = [
  { id: 9452,  offset: 1411418367, length: 3222,   sha256: "beb88f299a7bd3dbc694a633678faaff160dbf7b6840793f77651ec5f2e82e94" },
  { id: 10618, offset: 2423554403, length: 249947, sha256: "5b7768253646713d6035bea6bfd63fab34dceecc8ed7dfa000071665799a3e7d" }
];
const ATTEMPTS = [
  { name: "محاولة 1 (افتراضي)", headers: {} },
  { name: "محاولة 2 (افتراضي)", headers: {} },
  { name: "محاولة 3 (Accept: */*)", headers: { "Accept": "*/*" } },
  { name: "محاولة 4 (Accept: */*)", headers: { "Accept": "*/*" } },
  { name: "محاولة 5 (Accept: */*)", headers: { "Accept": "*/*" } },
  { name: "محاولة 6 (Accept: */*)", headers: { "Accept": "*/*" } }
];
const out = document.getElementById("out");
const logBox = document.getElementById("log");
let lines = [];

function say(text, cls) {
  lines.push(text);
  logBox.value = lines.join("\n");
  const d = document.createElement("div");
  d.className = "card " + (cls || "");
  d.textContent = text;
  out.appendChild(d);
}
const hex = (u8) => Array.from(u8).map(b => b.toString(16).padStart(2, "0")).join("");
async function sha256(u8) { return hex(new Uint8Array(await crypto.subtle.digest("SHA-256", u8))); }
function b64ToU8(b64) {
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function hget(headers, name) {
  const k = Object.keys(headers || {}).find(x => x.toLowerCase() === name.toLowerCase());
  return k ? headers[k] : "";
}
function magic(u8) {
  if (u8[0] === 0x1f && u8[1] === 0x8b) return "gzip";
  if (u8[0] === 0x28 && u8[1] === 0xb5 && u8[2] === 0x2f && u8[3] === 0xfd) return "zstd";
  if (u8[0] === 0x78 && [0x01, 0x5e, 0x9c, 0xda].includes(u8[1])) return "zlib";
  if (String.fromCharCode(...u8.slice(0, 15)) === "SQLite format 3") return "SQLite (غير مضغوط)";
  if (u8[0] === 0x3c) return "نص HTML/XML (ليس ملفًا)";
  return "غير معروف";
}
async function gunzip(u8) {
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function plugin() {
  const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
  if (!P) throw new Error("إضافة CapacitorHttp غير متاحة");
  return P;
}
async function req(url, headers, method) {
  const res = await plugin().request({
    url, method: method || "GET", headers: headers || {},
    responseType: method === "HEAD" ? "text" : "blob",
    connectTimeout: 30000, readTimeout: 60000
  });
  const u8 = method === "HEAD" ? new Uint8Array(0) : b64ToU8(res.data || "");
  return { status: res.status, headers: res.headers || {}, body: u8 };
}
function brief(r) {
  return "الرمز " + r.status + " | النوع " + (hget(r.headers, "content-type") || "؟") + " | الحجم " + r.body.length +
    " | Accept-Ranges: " + (hget(r.headers, "accept-ranges") || "غير ظاهر") +
    " | Content-Range: " + (hget(r.headers, "content-range") || "غير ظاهر");
}

function cookieNames(h) {
  const v = hget(h, "set-cookie");
  if (!v) return "لا";
  const names = []; const re = /(?:^|,\s*)([^=;,\s]+)=/g; let m;
  while ((m = re.exec(String(v)))) names.push(m[1]);
  return names.join("، ") || "نعم";
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function findWorkingHeaders() {
  say("— 1) قراءة index.json عدة مرات متتالية (لمعرفة هل النتيجة تتغير بين المحاولات)");
  for (const v of ATTEMPTS) {
    try {
      const r = await req(INDEX_URL, v.headers);
      const ok = (await sha256(r.body)) === INDEX_SHA;
      say(v.name + ": " + brief(r) + " | SHA256 " + (ok ? "يطابق" : "لا يطابق") +
          " | ملفات تعريف الارتباط: " + cookieNames(r.headers) +
          (hget(r.headers, "location") ? " | تحويل إلى: " + hget(r.headers, "location") : ""), ok ? "ok" : "warn");
      if (ok) return { v, body: r.body };
    } catch (e) { say(v.name + ": فشل (" + e.message + ")", "bad"); }
    await sleep(1500);
  }
  return null;
}
async function testRangeOnIndex(v, full) {
  say("— 2) اختبار Range على index.json (ملف صغير معروف المحتوى)");
  try {
    const r = await req(INDEX_URL, Object.assign({}, v.headers, { Range: "bytes=1000-1099" }));
    say(brief(r), r.status === 206 ? "ok" : "bad");
    if (r.status !== 206 || r.body.length !== 100) { say("Range لا يعمل بالشكل المتوقع؛ أوقفت الاختبار قبل لمس الحزمة الكبيرة.", "bad"); return false; }
    const same = hex(r.body) === hex(full.slice(1000, 1100));
    say(same ? "الجزء المستلم يطابق نفس الموضع من الملف الكامل." : "الجزء المستلم لا يطابق الملف الكامل.", same ? "ok" : "bad");
    return same;
  } catch (e) { say("فشل: " + e.message, "bad"); return false; }
}
async function testBook(t, v) {
  say("— كتاب رقم " + t.id + " (المتوقع " + t.length + " بايت)");
  try {
    const r = await req(PACK, Object.assign({}, v.headers, { Range: "bytes=" + t.offset + "-" + (t.offset + t.length - 1) }));
    say(brief(r), r.status === 206 ? "ok" : "bad");
    if (r.status !== 206 || r.body.length !== t.length) { say("لم يصل الجزء المطلوب.", "bad"); return false; }
    say("أول 16 بايت: " + hex(r.body.slice(0, 16)) + " | الصيغة: " + magic(r.body));
    const h1 = await sha256(r.body);
    say(h1 === t.sha256 ? "SHA256 يطابق الفهرس (على المحتوى المخزن)." : "SHA256 لا يطابق على المخزن.", h1 === t.sha256 ? "ok" : "warn");
    if (magic(r.body) === "gzip") {
      const raw = await gunzip(r.body);
      say("بعد فك gzip: " + raw.length + " بايت | الصيغة: " + magic(raw), "ok");
      const h2 = await sha256(raw);
      say(h2 === t.sha256 ? "SHA256 يطابق بعد فك الضغط." : "SHA256 لا يطابق بعد فك الضغط.", h2 === t.sha256 ? "ok" : "bad");
    } else if (magic(r.body) === "zstd") {
      say("الصيغة zstd: سنحتاج مكتبة لفكها.", "warn");
    }
    return true;
  } catch (e) { say("فشل: " + e.message, "bad"); return false; }
}

document.getElementById("run").onclick = async (ev) => {
  ev.target.disabled = true;
  out.innerHTML = ""; lines = [];
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  say("تطبيق أصلي: " + (native ? "نعم" : "لا") + " | فك gzip مدعوم: " + (typeof DecompressionStream !== "undefined" ? "نعم" : "لا"), native ? "ok" : "warn");
  const found = await findWorkingHeaders();
  if (!found) {
    say("لم تنجح أي محاولة في جلب الملف الحقيقي.", "bad");
  } else if (await testRangeOnIndex(found.v, found.body)) {
    for (const t of TESTS) { if (!(await testBook(t, found.v))) break; }
  }
  say("انتهى الاختبار.");
  ev.target.disabled = false;
  document.getElementById("copy").disabled = false;
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(logBox.value); }
  catch (e) { logBox.select(); document.execCommand("copy"); }
};
</script>
</body>
</html>
